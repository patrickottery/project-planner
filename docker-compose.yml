services:
  project-planner:
    build:
      context: .
      target: ${BUILD_TARGET:-prod}
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${APP_PORT}:5000"   # never a bare "PORT:PORT"
    networks:
      - proxy-network                # cloudflared reaches it here (container name)
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]                  # runs as uid 1000 on a high port; needs none
    volumes:
      - ${APPDATA_PATH}:/data
    env_file: .env
    labels:
      - autoheal=true
    healthcheck:
      # python:slim has no wget/curl
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  proxy-network:
    external: true
