services:
  project-planner:
    build:
      context: .
      target: ${BUILD_TARGET}
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "${APP_PORT}:5000"
    networks:
      - media-network
    volumes:
      - ${APPDATA_PATH}:/data
    env_file: .env
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  media-network:
    external: true
